<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            /* Background Image */
            background-image: url("amboumain-gate.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            /* Center the form */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            width: 350px;
            background: rgba(70, 130, 180, 0.85);
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 15px black;
        }

        h1 {
            color: white;
            margin-bottom: 10px;
        }

        p {
            color: white;
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            color: white;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .submit-btn,
        .reset-btn {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn {
            background: green;
        }

        .submit-btn:hover {
            background: darkgreen;
        }

        .reset-btn {
            background: red;
        }

        .reset-btn:hover {
            background: darkred;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h1>Welcome</h1>
        <p>Sign in to start your session</p>

        <form>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password">

            <button type="submit" class="submit-btn">Login</button>
            <button type="reset" class="reset-btn">Cancel</button> <br><br><br>
            <a href="#"> forgot Password</a>
        </form>
    </div>

</body>
</html>
